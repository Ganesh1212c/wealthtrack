<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger — net worth tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1918;
    --bg-elevated:#242220;
    --bg-elevated-2:#2C2A27;
    --border:#3A3733;
    --border-soft:#302E2B;
    --text-primary:#F2EDE4;
    --text-secondary:#B5AFA3;
    --text-tertiary:#8A857A;
    --accent:#D97757;
    --accent-strong:#E58A67;
    --positive:#8FAE83;
    --negative:#C4675F;
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:18px;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;
    --font-serif:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  .lock-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:var(--sp-4);}
  .lock-screen[hidden]{display:none;}
  .lock-card{width:100%;max-width:300px;text-align:center;}
  .lock-card .brand{justify-content:center;margin-bottom:var(--sp-2);}
  .lock-sub{color:var(--text-tertiary);font-size:.85rem;margin-bottom:var(--sp-5);}
  .lock-error{color:var(--negative);font-size:.8rem;margin-top:var(--sp-3);min-height:1em;}
  .pin-dots{display:flex;justify-content:center;gap:16px;margin-bottom:var(--sp-2);}
  .pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border);background:transparent;transition:background .15s ease,border-color .15s ease;}
  .pin-dot.filled{background:var(--accent);border-color:var(--accent);}
  .pin-dots.error .pin-dot.filled{background:var(--negative);border-color:var(--negative);}
  .pin-dots.error{animation:shake .3s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:var(--sp-5);}
  .key{aspect-ratio:1;border-radius:50%;border:1px solid var(--border-soft);background:var(--bg-elevated);color:var(--text-primary);font-size:1.3rem;font-family:var(--font-serif);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .08s ease,box-shadow .08s ease,transform .08s ease;}
  @media (hover:hover){ .key:hover{border-color:var(--accent);} }
  .key:active,.key.pressed{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,119,87,0.18);transform:scale(0.94);}
  .key-empty{visibility:hidden;pointer-events:none;}
  .key-back{font-size:1rem;color:var(--text-tertiary);border:none;background:none;}
  @media (hover:hover){ .key-back:hover{color:var(--text-primary);border:none;background:none;} }
  .key-back:active,.key-back.pressed{color:var(--accent);}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--font-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{margin:0;font-family:var(--font-serif);font-weight:500;}
  p{margin:0;}
  ul{list-style:none;margin:0;padding:0;}
  button,input{font-family:inherit;color:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}}

  .app{max-width:1080px;margin:0 auto;padding:var(--sp-4) var(--sp-4) var(--sp-8);}

  /* topbar */
  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:var(--sp-4) 0 var(--sp-5);}
  .brand{display:flex;align-items:center;gap:var(--sp-2);font-family:var(--font-serif);font-size:1.05rem;letter-spacing:.2px;}
  .brand-mark{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;}
  .topbar-right{display:flex;align-items:center;gap:var(--sp-3);}
  .icon-btn{background:none;border:1px solid var(--border-soft);color:var(--text-tertiary);border-radius:8px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0;}
  @media (hover:hover){ .icon-btn:hover{border-color:var(--accent);color:var(--text-primary);} }
  .date{color:var(--text-tertiary);font-size:.82rem;}

  /* buttons */
  .btn{border:1px solid var(--border);background:transparent;color:var(--text-primary);padding:9px 14px;border-radius:var(--radius-sm);font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s ease,border-color .15s ease;}
  .btn:hover{border-color:var(--accent);}
  .btn.small{padding:6px 10px;font-size:.78rem;}
  .btn-ghost{background:transparent;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#1A1918;font-weight:600;}
  .btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
  .btn-secondary{background:var(--bg-elevated);border-color:var(--border);width:100%;justify-content:center;margin-top:var(--sp-4);}

  /* hero */
  .hero{display:grid;grid-template-columns:1fr;gap:var(--sp-6);align-items:center;padding:var(--sp-4) 0 var(--sp-6);border-bottom:1px solid var(--border-soft);}
  @media(min-width:860px){.hero{grid-template-columns:1.15fr .85fr;}}
  .hero-label{margin:0 0 var(--sp-2);color:var(--text-tertiary);font-size:.85rem;}
  .hero-number{font-size:clamp(2.5rem,8vw,3.6rem);font-weight:500;letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums;}
  .hero-delta{margin-top:var(--sp-3);font-size:.9rem;display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:20px;background:var(--bg-elevated);}
  .hero-delta.positive{color:var(--positive);}
  .hero-delta.negative{color:var(--negative);}
  .link-edit{display:block;margin-top:var(--sp-4);background:none;border:none;color:var(--text-tertiary);font-size:.8rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;}
  .link-edit:hover{color:var(--text-secondary);}
  .hero-chart{display:flex;flex-direction:column;align-items:center;}
  .hero-chart .chart-box{width:100%;max-width:260px;}
  .chart-box{position:relative;height:220px;}
  .chart-box.tall{height:240px;}
  .legend{display:flex;flex-wrap:wrap;gap:var(--sp-3);justify-content:center;margin-top:var(--sp-3);}
  .legend li{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--text-secondary);}
  .legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .legend b{color:var(--text-primary);font-weight:600;}

  /* category cards */
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-3);padding:var(--sp-5) 0;}
  @media(min-width:860px){.cards{grid-template-columns:repeat(4,1fr);}}
  .card{text-align:left;background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:var(--sp-4);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s ease;}
  .card:hover{border-color:var(--cat-color);}
  .card-dot{width:8px;height:8px;border-radius:50%;background:var(--cat-color);}
  .card-name{font-size:.78rem;color:var(--text-secondary);}
  .card-amount{font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;}
  .card-bar{height:3px;background:var(--bg-elevated-2);border-radius:2px;overflow:hidden;margin-top:2px;}
  .card-bar-fill{display:block;height:100%;background:var(--cat-color);}

  /* insights */
  .insights{display:flex;flex-wrap:wrap;gap:var(--sp-3);padding-bottom:var(--sp-5);}
  .insight{display:flex;align-items:center;gap:8px;background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:20px;padding:8px 14px;font-size:.82rem;color:var(--text-secondary);}
  .insight-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

  /* chart panels */
  .charts-row{display:grid;grid-template-columns:1fr;gap:var(--sp-4);padding-bottom:var(--sp-5);}
  @media(min-width:860px){.charts-row{grid-template-columns:1.3fr 1fr;}}
  .panel{background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:var(--sp-5);}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-4);}
  .panel-head h2{font-size:1rem;font-weight:500;}
  .panel-head .link-edit{margin-top:0;}
  .hint{margin-top:var(--sp-3);font-size:.78rem;color:var(--text-tertiary);}

  /* accounts */
  .accounts{padding:var(--sp-5) 0;border-top:1px solid var(--border-soft);}
  .accounts > h2{font-size:1.1rem;font-weight:500;margin-bottom:var(--sp-4);}
  .category-panel{border:1px solid var(--border-soft);border-radius:var(--radius-md);margin-bottom:var(--sp-3);overflow:hidden;}
  .category-head{display:flex;align-items:center;gap:10px;padding:var(--sp-4);cursor:pointer;background:var(--bg-elevated);}
  .chev{display:inline-flex;color:var(--text-tertiary);transition:transform .18s ease;}
  .chev.open{transform:rotate(180deg);}
  .category-dot{width:9px;height:9px;border-radius:50%;background:var(--cat-color);}
  .category-name{flex:1;font-size:.95rem;font-weight:500;}
  .category-total{font-variant-numeric:tabular-nums;color:var(--text-secondary);font-size:.9rem;}
  .category-body{padding:0 var(--sp-4) var(--sp-4);}
  .account-row{padding:10px 0;border-bottom:1px solid var(--border-soft);}
  .account-row:last-child{border-bottom:none;}
  .account-row-main{display:flex;align-items:center;gap:8px;}
  .account-name{flex:1;font-size:.88rem;color:var(--text-secondary);cursor:pointer;border-radius:6px;padding:2px 4px;}
  .account-name:hover{background:var(--bg-elevated-2);}
  .account-amount{font-variant-numeric:tabular-nums;font-size:.9rem;cursor:pointer;padding:4px 8px;border-radius:6px;flex-shrink:0;}
  .account-amount:hover{background:var(--bg-elevated-2);}
  .account-amount.computed{cursor:default;flex:1;text-align:right;}
  .account-amount.computed:hover{background:none;}
  .inline-edit{width:110px;background:var(--bg-elevated-2);border:1px solid var(--accent);border-radius:6px;color:var(--text-primary);padding:4px 6px;font-size:.9rem;font-family:inherit;}
  .row-remove{background:none;border:none;color:var(--text-tertiary);cursor:pointer;padding:4px;display:flex;flex-shrink:0;}
  .row-remove:hover{color:var(--negative);}
  .mini-btn{background:none;border:1px solid var(--border-soft);color:var(--text-tertiary);border-radius:6px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0;}
  .mini-btn:hover{border-color:var(--accent);color:var(--text-primary);}
  .mini-btn.subtle{width:auto;padding:0 6px;font-size:.7rem;border:none;text-decoration:underline;text-underline-offset:3px;color:var(--text-tertiary);}
  .chev-inline{background:none;border:none;color:var(--text-tertiary);cursor:pointer;display:flex;padding:2px;transition:transform .18s ease;flex-shrink:0;}
  .chev-inline.open{transform:rotate(180deg);}
  .split-panel{margin:var(--sp-3) 0 0 22px;padding-left:var(--sp-3);border-left:2px solid var(--border-soft);}
  .split-list{list-style:none;margin:0;padding:0;}
  .split-row{display:flex;align-items:center;gap:8px;padding:6px 0;}
  .split-name{flex:1;font-size:.82rem;color:var(--text-tertiary);cursor:pointer;border-radius:6px;padding:2px 4px;}
  .split-name:hover{background:var(--bg-elevated-2);}
  .split-amount{font-variant-numeric:tabular-nums;font-size:.85rem;cursor:pointer;padding:3px 6px;border-radius:6px;flex-shrink:0;}
  .split-amount:hover{background:var(--bg-elevated-2);}
  .add-split-row{margin-top:var(--sp-2);}
  .split-form{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .split-form[hidden]{display:none;}
  .split-form input{background:var(--bg-elevated-2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:.82rem;color:var(--text-primary);}
  .split-form input[data-field="name"]{flex:2;min-width:100px;}
  .split-form input[data-field="amount"]{flex:1;min-width:80px;}
  .add-account-row{margin-top:var(--sp-3);}
  .inline-form{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .inline-form[hidden]{display:none;}
  .inline-form input{background:var(--bg-elevated-2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:.85rem;color:var(--text-primary);}
  .inline-form input[data-field="name"]{flex:2;min-width:120px;}
  .inline-form input[data-field="amount"]{flex:1;min-width:90px;}
  .remove-category{background:none;border:none;color:var(--text-tertiary);font-size:.76rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;margin-top:var(--sp-3);}
  .remove-category:hover{color:var(--negative);}
  .card.liability{border-color:rgba(196,103,95,0.35);}
  .card.liability .card-amount{color:var(--negative);}
  .card.excluded{opacity:.6;}
  .card.excluded .card-amount{color:var(--text-tertiary);}
  .category-total.negative{color:var(--negative);}
  .category-total.excluded{color:var(--text-tertiary);}
  .category-panel.excluded{opacity:.7;}
  .cat-type-badge{font:inherit;font-size:.66rem;padding:3px 8px;border-radius:20px;border:none;background:var(--bg-elevated-2);color:var(--text-tertiary);cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .cat-type-badge:hover{border:1px solid var(--accent);}
  .cat-type-badge.liability{color:var(--negative);background:rgba(196,103,95,0.12);}
  .cat-type-badge.excluded{color:var(--text-tertiary);background:var(--bg-elevated-2);}
  .modal-type-row{display:flex;align-items:center;gap:10px;margin-bottom:var(--sp-4);}
  .modal-type-label{color:var(--text-secondary);font-size:.82rem;}

  /* modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(10,9,8,.6);display:flex;align-items:center;justify-content:center;padding:var(--sp-4);z-index:50;}
  .modal-backdrop[hidden]{display:none;}
  .modal{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp-5);width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
  .modal-head h3{font-size:1.05rem;font-weight:500;margin-bottom:var(--sp-4);}
  .modal-form label{display:block;font-size:.82rem;color:var(--text-secondary);margin-bottom:var(--sp-4);}
  .modal-form input{display:block;width:100%;margin-top:6px;background:var(--bg-elevated-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:.95rem;color:var(--text-primary);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:var(--sp-2);}

  /* footer */
  .footer{padding-top:var(--sp-5);border-top:1px solid var(--border-soft);}
  .footer p{color:var(--text-tertiary);font-size:.78rem;}
  .footer-actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .sync-status.error{color:var(--negative);}
  .sync-status.synced{color:var(--positive);}
</style>
</head>
<body>
<div class="lock-screen" id="lockScreen">
  <div class="lock-card">
    <div class="brand"><span class="brand-mark"></span>Ledger</div>
    <p class="lock-sub">Enter MPIN to continue</p>
    <div class="pin-dots" id="pinDots">
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
    </div>
    <p class="lock-error" id="pinError" hidden></p>
    <div class="keypad" id="keypad">
      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key key-empty" tabindex="-1" aria-hidden="true"></button>
      <button class="key" data-key="0">0</button>
      <button class="key key-back" data-key="back" aria-label="Backspace">&#9003;</button>
    </div>
  </div>
</div>
<div class="app" id="appRoot" hidden>
  <header class="topbar">
    <div class="brand"><span class="brand-mark"></span>Ledger</div>
    <div class="topbar-right">
      <span class="date" id="todayDate"></span>
      <button class="icon-btn" id="lockBtn" aria-label="Lock app" title="Lock">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7V4.8a2.5 2.5 0 015 0V7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-stat">
      <p class="hero-label">Net worth</p>
      <h1 class="hero-number" id="heroNumber">₹0</h1>
      <div class="hero-delta" id="heroDelta"></div>
      <button class="link-edit" id="editCapitalBtn">Edit starting capital</button>
    </div>
    <div class="hero-chart">
      <div class="chart-box"><canvas id="allocationChart"></canvas></div>
      <ul class="legend" id="allocationLegend"></ul>
    </div>
  </section>

  <section class="cards" id="categoryCards"></section>

  <section class="insights" id="insights"></section>

  <section class="charts-row">
    <div class="panel">
      <div class="panel-head">
        <h2>Growth</h2>
        <button class="link-edit" id="clearHistoryBtn">Clear history</button>
      </div>
      <div class="chart-box tall"><canvas id="growthChart"></canvas></div>
      <p class="hint">Today updates live as you use the app — it locks in once the date changes and a new point starts.</p>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>By category</h2></div>
      <div class="chart-box tall"><canvas id="compareChart"></canvas></div>
    </div>
  </section>

  <section class="accounts">
    <h2>Accounts</h2>
    <div id="categoryList"></div>
    <button class="btn btn-secondary" id="addCategoryBtn">Add category</button>
  </section>

  <footer class="footer">
    <p class="sync-status" id="syncStatus">Not connected to a database yet</p>
    <div class="footer-actions">
      <button class="btn btn-ghost small" id="backupBtn">Download backup</button>
      <button class="btn btn-ghost small" id="changeMpinBtn">Change MPIN</button>
    </div>
  </footer>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal"></div>
</div>

        {id:'l1', name:'Tejas', amount:1000, splits:[]}
      ]}
    ],
    history: []
  };

  let idCounter = 0;
  function uid(prefix){ idCounter++; return (prefix||'x') + idCounter + Date.now().toString(36); }
  function nextColor(){ return PALETTE[state.categories.length % PALETTE.length]; }

  function formatINR(n){
    const v = Math.round(n);
    const sign = v < 0 ? '\u2212' : '';
    return sign + '\u20B9' + Math.abs(v).toLocaleString('en-IN');
  }
  function formatShortINR(v){
    const av = Math.abs(v);
    const sign = v < 0 ? '\u2212' : '';
    if (av >= 100000) return sign + '\u20B9' + (av/100000).toFixed(1) + 'L';
    if (av >= 1000) return sign + '\u20B9' + (av/1000).toFixed(0) + 'k';
    return sign + '\u20B9' + av;
  }
  function formatPct(n){
    return (n<0?'\u2212':'') + Math.abs(n).toFixed(1) + '%';
  }
  function esc(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function reduceMotion(){
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function accountTotal(acc){
    if (acc.splits && acc.splits.length) return acc.splits.reduce((s,x)=>s+Number(x.amount||0),0);
    return Number(acc.amount||0);
  }
  function categoryTotal(cat){ return cat.accounts.reduce((s,a)=>s+accountTotal(a),0); }
  function categoryImpact(cat){ return cat.type==='liability' ? -categoryTotal(cat) : categoryTotal(cat); }
  function isCounted(cat){ return cat.included !== false; }
  function isCountedAsset(cat){ return cat.type !== 'liability' && isCounted(cat); }
  function grandTotal(){ return state.categories.reduce((s,c)=> s + (isCounted(c) ? categoryImpact(c) : 0), 0); }

  const $ = sel => document.querySelector(sel);
  const heroNumberEl = $('#heroNumber');
  const heroDeltaEl = $('#heroDelta');
  const cardsEl = $('#categoryCards');
  const insightsEl = $('#insights');
  const categoryListEl = $('#categoryList');
  const allocationLegendEl = $('#allocationLegend');
  const todayDateEl = $('#todayDate');
  const modalBackdrop = $('#modalBackdrop');
  const modalEl = $('#modal');
  const syncStatusEl = $('#syncStatus');

  const ICON = {
    chevron: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    trash: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 4h10M6.5 4V2.8a.8.8 0 01.8-.8h1.4a.8.8 0 01.8.8V4M4.5 4l.6 8.4a1 1 0 001 .9h3.8a1 1 0 001-.9L11.5 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    plus: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    minus: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'
  };

  /* ---------- persistence (Supabase) ---------- */

  let supabaseClient = null;
  try {
    if (window.supabase && SUPABASE_URL.indexOf('supabase.co') !== -1) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  } catch (err) { console.error('Supabase init failed:', err); }

  function setSyncStatus(status){
    if (!syncStatusEl) return;
    const map = {
      synced:'Saved', saving:'Saving…', loading:'Loading your data…',
      error:'Could not sync — check your Supabase URL and key',
      offline:'Not connected to a database yet — changes won\u2019t be saved'
    };
    syncStatusEl.textContent = map[status] || '';
    syncStatusEl.className = 'sync-status ' + status;
  }

  async function loadState(){
    if (!supabaseClient){ setSyncStatus('offline'); return; }
    setSyncStatus('loading');
    try {
      const { data, error } = await supabaseClient.from('wealth_state').select('data').eq('id',1).maybeSingle();
      if (error) throw error;
      if (data && data.data && data.data.categories){
        state = data.data;
        setSyncStatus('synced');
      } else {
        await saveState();
      }
    } catch (err){
      console.error('Could not load saved data:', err);
      setSyncStatus('error');
    }
  }

  // Kicked off immediately on page load (in parallel with the lock screen),
  // so the MPIN check doesn't need to wait for a fresh network round trip —
  // by the time someone finishes typing 4 digits, this has usually resolved.
  // boot() reuses this same promise instead of fetching a second time.
  let stateLoadPromise = null;
  function ensureStateLoaded(){
    if (!stateLoadPromise) stateLoadPromise = loadState();
    return stateLoadPromise;
  }
  ensureStateLoaded();

  let saveTimer = null;
  function saveState(){
    if (!supabaseClient) return Promise.resolve();
    setSyncStatus('saving');
    clearTimeout(saveTimer);
    return new Promise(resolve=>{
      saveTimer = setTimeout(async ()=>{
        try {
          const { error } = await supabaseClient.from('wealth_state').upsert({ id:1, data: state, updated_at: new Date().toISOString() });
          if (error) throw error;
          setSyncStatus('synced');
        } catch (err){
          console.error('Could not save:', err);
          setSyncStatus('error');
        }
        resolve();
      }, 500);
    });
  }

  /* ---------- rendering ---------- */

  let lastHeroValue = 0;
  function animateNumber(el, from, to, duration, fmt){
    if (reduceMotion()){ el.textContent = fmt(to); return; }
    const start = performance.now();
    function tick(now){
      const t = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-t, 3);
      el.textContent = fmt(from + (to-from)*eased);
      if (t<1) requestAnimationFrame(tick); else el.textContent = fmt(to);
    }
    requestAnimationFrame(tick);
  }

  function renderHero(){
    const total = grandTotal();
    animateNumber(heroNumberEl, lastHeroValue, total, 700, formatINR);
    lastHeroValue = total;

    const gain = total - state.initialCapital;
    const pct = state.initialCapital !== 0 ? (gain/state.initialCapital)*100 : 0;
    heroDeltaEl.className = 'hero-delta ' + (gain>=0 ? 'positive':'negative');
    heroDeltaEl.innerHTML = (gain>=0 ? '\u25B2 ' : '\u25BC ') + formatINR(Math.abs(gain)) + ' (' + formatPct(pct) + ') since ' + formatINR(state.initialCapital) + ' start';
  }

  function renderCards(){
    const totalAssets = state.categories.filter(isCountedAsset).reduce((s,c)=>s+categoryTotal(c),0) || 1;
    cardsEl.innerHTML = state.categories.map(cat=>{
      const isLiability = cat.type==='liability';
      const isExcluded = !isCounted(cat);
      const t = categoryTotal(cat);
      const impact = categoryImpact(cat);
      const share = (isLiability || isExcluded) ? 0 : (t/totalAssets)*100;
      let suffix = '';
      if (isExcluded) suffix = ' · not counted';
      else if (isLiability) suffix = ' · liability';
      const cardClass = isExcluded ? 'excluded' : (isLiability ? 'liability' : '');
      return '<button class="card '+cardClass+'" data-jump="'+cat.id+'" style="--cat-color:'+cat.color+'">'
        + '<span class="card-dot"></span>'
        + '<span class="card-name">'+esc(cat.name)+suffix+'</span>'
        + '<span class="card-amount">'+formatINR(impact)+'</span>'
        + ((isLiability || isExcluded) ? '' : '<span class="card-bar"><span class="card-bar-fill" style="width:'+share+'%"></span></span>')
        + '</button>';
    }).join('');
  }

  function renderInsights(){
    const total = grandTotal();
    const assetCats = state.categories.filter(isCountedAsset);
    const totalAssets = assetCats.reduce((s,c)=>s+categoryTotal(c),0);
    const chips = [];

    if (totalAssets > 0){
      const sorted = [...assetCats].sort((a,b)=>categoryTotal(b)-categoryTotal(a));
      const top = sorted[0];
      const topShare = (categoryTotal(top)/totalAssets)*100;
      chips.push('<div class="insight"><span class="insight-dot" style="background:'+top.color+'"></span>'+esc(top.name)+' makes up '+formatPct(topShare)+' of your assets</div>');
    }

    const gain = total - state.initialCapital;
    chips.push('<div class="insight"><span class="insight-dot" style="background:'+(gain>=0?'var(--positive)':'var(--negative)')+'"></span>'+(gain>=0?'Grown ':'Down ')+formatINR(Math.abs(gain))+' since you started with '+formatINR(state.initialCapital)+'</div>');

    const liabilityCats = state.categories.filter(c=>c.type==='liability' && isCounted(c) && categoryTotal(c)>0);
    if (liabilityCats.length){
      const totalLiabilities = liabilityCats.reduce((s,c)=>s+categoryTotal(c),0);
      chips.push('<div class="insight"><span class="insight-dot" style="background:var(--negative)"></span>'+formatINR(totalLiabilities)+' in liabilities</div>');
    }

    insightsEl.innerHTML = chips.join('');
  }

  function renderAccountRow(cat, acc){
    const hasSplits = acc.splits && acc.splits.length > 0;
    const amt = accountTotal(acc);
    if (!hasSplits){
      return '<li class="account-row" data-cat="'+cat.id+'" data-acc="'+acc.id+'">'
        + '<div class="account-row-main">'
        + '<span class="account-name" data-action="edit-field" data-field="name">'+esc(acc.name)+'</span>'
        + '<span class="account-amount" data-action="edit-field" data-field="amount">'+formatINR(amt)+'</span>'
        + '<button class="mini-btn" data-action="adjust-plus" aria-label="Add to '+esc(acc.name)+'">'+ICON.plus+'</button>'
        + '<button class="mini-btn" data-action="adjust-minus" aria-label="Subtract from '+esc(acc.name)+'">'+ICON.minus+'</button>'
        + '<button class="mini-btn subtle" data-action="start-split">Split</button>'
        + '<button class="row-remove" data-action="remove-account" aria-label="Remove '+esc(acc.name)+'">'+ICON.trash+'</button>'
        + '</div>'
        + '</li>';
    }
    const splitRows = acc.splits.map(sp =>
      '<li class="split-row" data-cat="'+cat.id+'" data-acc="'+acc.id+'" data-split="'+sp.id+'">'
      + '<span class="split-name" data-action="edit-field" data-field="name">'+esc(sp.name)+'</span>'
      + '<span class="split-amount" data-action="edit-field" data-field="amount">'+formatINR(sp.amount)+'</span>'
      + '<button class="mini-btn" data-action="adjust-plus" aria-label="Add to '+esc(sp.name)+'">'+ICON.plus+'</button>'
      + '<button class="mini-btn" data-action="adjust-minus" aria-label="Subtract from '+esc(sp.name)+'">'+ICON.minus+'</button>'
      + '<button class="row-remove" data-action="remove-split" aria-label="Remove '+esc(sp.name)+'">'+ICON.trash+'</button>'
      + '</li>'
    ).join('');
    return '<li class="account-row split" data-cat="'+cat.id+'" data-acc="'+acc.id+'">'
      + '<div class="account-row-main">'
      + '<button class="chev-inline '+(acc.splitOpen?'open':'')+'" data-action="toggle-split-panel" aria-label="Toggle split breakdown">'+ICON.chevron+'</button>'
      + '<span class="account-name" data-action="edit-field" data-field="name">'+esc(acc.name)+'</span>'
      + '<span class="account-amount computed">'+formatINR(amt)+'</span>'
      + '<button class="row-remove" data-action="remove-account" aria-label="Remove '+esc(acc.name)+'">'+ICON.trash+'</button>'
      + '</div>'
      + '<div class="split-panel" '+(acc.splitOpen?'':'hidden')+'>'
      + '<ul class="split-list">'+splitRows+'</ul>'
      + '<div class="add-split-row">'
      + '<button class="btn btn-ghost small" data-action="show-add-split">'+ICON.plus+' Add split</button>'
      + '<form class="split-form" data-cat="'+cat.id+'" data-acc="'+acc.id+'" hidden>'
      + '<input type="text" placeholder="Part name" data-field="name" required maxlength="30">'
      + '<input type="number" placeholder="Amount" data-field="amount" required step="1">'
      + '<button type="submit" class="btn btn-primary small">Save</button>'
      + '<button type="button" class="btn btn-ghost small" data-action="cancel-add-split">Cancel</button>'
      + '</form>'
      + '</div>'
      + '<button class="remove-category" data-action="merge-splits">Merge back into one amount</button>'
      + '</div>'
      + '</li>';
  }

  function renderAccounts(){
    categoryListEl.innerHTML = state.categories.map(cat=>{
      const isLiability = cat.type==='liability';
      const isExcluded = !isCounted(cat);
      const rows = cat.accounts.map(acc => renderAccountRow(cat, acc)).join('');
      return '<div class="category-panel '+(isExcluded?'excluded':'')+'" id="cat-'+cat.id+'" style="--cat-color:'+cat.color+'">'
        + '<div class="category-head" data-action="toggle-category" data-cat="'+cat.id+'" role="button" tabindex="0" aria-expanded="'+cat.open+'">'
        + '<span class="chev '+(cat.open?'open':'')+'">'+ICON.chevron+'</span>'
        + '<span class="category-dot"></span>'
        + '<span class="category-name" data-action="edit-field" data-field="name">'+esc(cat.name)+'</span>'
        + '<span class="cat-type-badge '+(isLiability?'liability':'')+'" data-action="toggle-category-type" data-cat="'+cat.id+'" title="Click to switch between asset and liability">'+(isLiability?'Liability':'Asset')+'</span>'
        + '<span class="category-total '+(isExcluded?'excluded':(isLiability?'negative':''))+'">'+formatINR(categoryImpact(cat))+'</span>'
        + '</div>'
        + '<div class="category-body" '+(cat.open?'':'hidden')+'>'
        + '<ul class="account-list">'+rows+'</ul>'
        + '<div class="add-account-row">'
        + '<button class="btn btn-ghost small" data-action="show-add-account">'+ICON.plus+' Add account</button>'
        + '<form class="inline-form" data-cat="'+cat.id+'" hidden>'
        + '<input type="text" placeholder="Account name" data-field="name" required maxlength="40">'
        + '<input type="number" placeholder="Amount" data-field="amount" required step="1">'
        + '<button type="submit" class="btn btn-primary small">Save</button>'
        + '<button type="button" class="btn btn-ghost small" data-action="cancel-add-account">Cancel</button>'
        + '</form>'
        + '</div>'
        + '<button class="remove-category" data-action="toggle-category-included" data-cat="'+cat.id+'">'+(isExcluded?'Not counted toward net worth \u2014 tap to include':'Counted toward net worth \u2014 tap to exclude')+'</button>'
        + '<button class="remove-category" data-action="remove-category" data-cat="'+cat.id+'">Remove '+esc(cat.name)+' category</button>'
        + '</div>'
        + '</div>';
    }).join('');
  }

  /* ---------- charts ---------- */

  let allocationChart, growthChart, compareChart;
  let allocationCenterLabel = '';

  const centerTextPlugin = {
    id:'centerText',
    afterDraw(chart){
      if (chart.canvas.id !== 'allocationChart') return;
      const {ctx, chartArea} = chart;
      if(!chartArea) return;
      const cx = (chartArea.left+chartArea.right)/2;
      const cy = (chartArea.top+chartArea.bottom)/2;
      ctx.save();
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle = 'rgba(242,237,228,0.5)';
      ctx.font = '500 12px Inter, sans-serif';
      ctx.fillText('Assets', cx, cy-11);
      ctx.fillStyle = '#F2EDE4';
      ctx.font = '600 19px Inter, sans-serif';
      ctx.fillText(allocationCenterLabel, cx, cy+11);
      ctx.restore();
    }
  };

  const valueLabelPlugin = {
    id:'valueLabels',
    afterDatasetsDraw(chart){
      if (chart.canvas.id !== 'compareChart') return;
      const {ctx} = chart;
      const meta = chart.getDatasetMeta(0);
      ctx.save();
      ctx.fillStyle = 'rgba(242,237,228,0.75)';
      ctx.font = '600 11px Inter, sans-serif';
      ctx.textAlign='center';
      meta.data.forEach((bar,i)=>{
        const val = chart.data.datasets[0].data[i];
        const yPos = val >= 0 ? bar.y - 8 : bar.y + 16;
        ctx.fillText(formatINR(val), bar.x, yPos);
      });
      ctx.restore();
    }
  };

  function initCharts(){
    Chart.register(centerTextPlugin, valueLabelPlugin);
    Chart.defaults.color = 'rgba(242,237,228,0.6)';
    Chart.defaults.font.family = "'Inter', sans-serif";
    const animDuration = reduceMotion() ? 0 : 600;

    allocationChart = new Chart(document.getElementById('allocationChart').getContext('2d'), {
      type:'doughnut',
      data:{ labels:[], datasets:[{ data:[], backgroundColor:[], borderWidth:0, hoverOffset:6 }]},
      options:{
        responsive:true, maintainAspectRatio:false, cutout:'68%',
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => ' ' + ctx.label + ': ' + formatINR(ctx.parsed) } } },
        animation:{ duration: animDuration }
      }
    });

    growthChart = new Chart(document.getElementById('growthChart').getContext('2d'), {
      type:'line',
      data:{ labels:[], datasets:[{
        data:[], borderColor:'#D97757', backgroundColor:'rgba(217,119,87,0.14)',
        fill:true, tension:0.35, pointRadius:4, pointBackgroundColor:'#D97757',
        pointBorderColor:'#1A1918', pointBorderWidth:2, borderWidth:2.5
      }]},
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => ' ' + formatINR(ctx.parsed.y) } } },
        scales:{
          x:{ grid:{display:false}, border:{display:false} },
          y:{ grid:{color:'rgba(255,255,255,0.06)'}, border:{display:false}, ticks:{ callback:v=>formatShortINR(v) } }
        },
        animation:{ duration: animDuration }
      }
    });

    compareChart = new Chart(document.getElementById('compareChart').getContext('2d'), {
      type:'bar',
      data:{ labels:[], datasets:[{ data:[], backgroundColor:[], borderRadius:6, maxBarThickness:56 }]},
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => ' ' + formatINR(ctx.parsed.y) } } },
        scales:{
          x:{ grid:{display:false}, border:{display:false} },
          y:{ grid:{color:'rgba(255,255,255,0.06)'}, border:{display:false}, ticks:{ callback:v=>formatShortINR(v) } }
        },
        animation:{ duration: animDuration }
      }
    });
  }

  function updateCharts(){
    const assetCats = state.categories.filter(c=>isCountedAsset(c) && categoryTotal(c)>0);
    const totalAssets = assetCats.reduce((s,c)=>s+categoryTotal(c),0);
    allocationCenterLabel = formatINR(totalAssets);

    allocationChart.data.labels = assetCats.map(c=>c.name);
    allocationChart.data.datasets[0].data = assetCats.map(c=>categoryTotal(c));
    allocationChart.data.datasets[0].backgroundColor = assetCats.map(c=>c.color);
    allocationChart.update();

    allocationLegendEl.innerHTML = assetCats.map(c=>{
      const t = categoryTotal(c);
      const pct = totalAssets ? (t/totalAssets*100) : 0;
      return '<li><span class="dot" style="background:'+c.color+'"></span>'+esc(c.name)+' <b>'+formatPct(pct)+'</b></li>';
    }).join('');

    compareChart.data.labels = state.categories.map(c=>c.name);
    compareChart.data.datasets[0].data = state.categories.map(c=>categoryImpact(c));
    compareChart.data.datasets[0].backgroundColor = state.categories.map(c=>
      !isCounted(c) ? '#6E6A61' : (c.type==='liability' ? '#C4675F' : c.color)
    );
    compareChart.update();

    const points = [{label:'Start', total: state.initialCapital}, ...state.history];
    growthChart.data.labels = points.map(p=>p.label);
    growthChart.data.datasets[0].data = points.map(p=>p.total);
    growthChart.update();
  }

  function render(){
    syncTodayHistory();
    renderHero();
    renderCards();
    renderInsights();
    renderAccounts();
    updateCharts();
  }

  /* ---------- generic inline field editor (names + amounts, categories + accounts + splits) ---------- */

  function startEdit(el, opts){
    if (el.querySelector('input')) return;
    const input = document.createElement('input');
    input.type = opts.numeric ? 'number' : 'text';
    if (opts.numeric) input.step = '1';
    input.value = opts.value;
    input.className = 'inline-edit';
    el.textContent = '';
    el.appendChild(input);
    input.focus(); input.select();
    const commit = () => {
      const raw = input.value;
      if (opts.numeric){
        const v = Number(raw);
        if (!Number.isNaN(v)) opts.onCommit(v);
      } else {
        const v = raw.trim();
        if (v) opts.onCommit(v);
      }
      render(); saveState();
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', ev=>{
      if (ev.key==='Enter'){ ev.preventDefault(); input.blur(); }
      else if (ev.key==='Escape'){ ev.preventDefault(); render(); }
    });
  }

  function resolveRowTarget(row){
    const cat = state.categories.find(c=>c.id===row.dataset.cat);
    if (!cat) return null;
    if (!row.dataset.acc) return cat;
    const acc = cat.accounts.find(a=>a.id===row.dataset.acc);
    if (!acc) return null;
    if (row.dataset.split) return (acc.splits||[]).find(s=>s.id===row.dataset.split) || null;
    return acc;
  }

  /* ---------- backup ---------- */

  function downloadBackup(){
    const payload = JSON.stringify(state, null, 2);
    const blob = new Blob([payload], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ledger-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------- modal ---------- */

  function openModal(title, bodyHTML, onSubmit){
    modalEl.innerHTML = '<div class="modal-head"><h3>'+title+'</h3></div>'
      + '<form class="modal-form">'+bodyHTML
      + '<div class="modal-actions">'
      + '<button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>'
      + '<button type="submit" class="btn btn-primary">Save</button>'
      + '</div></form>';
    modalBackdrop.hidden = false;
    document.body.style.overflow = 'hidden';
    const form = modalEl.querySelector('.modal-form');
    form.addEventListener('submit', e=>{ e.preventDefault(); onSubmit(form); closeModal(); });
    const first = modalEl.querySelector('input');
    if (first) first.focus();
  }
  function closeModal(){
    modalBackdrop.hidden = true;
    document.body.style.overflow = '';
    modalEl.innerHTML = '';
  }

  /* ---------- events ---------- */

  document.addEventListener('click', e=>{
    if (e.target.closest('.inline-edit')) return;

    const cardEl = e.target.closest('.card');
    if (cardEl){
      const target = document.getElementById('cat-'+cardEl.dataset.jump);
      if (target) target.scrollIntoView({behavior: reduceMotion()?'auto':'smooth', block:'start'});
      return;
    }
    if (e.target.closest('[data-action="close-modal"]')){ closeModal(); return; }
    if (e.target === modalBackdrop){ closeModal(); return; }

    const editEl = e.target.closest('[data-action="edit-field"]');
    if (editEl && !editEl.querySelector('input')){
      const row = editEl.closest('[data-cat]');
      const target = resolveRowTarget(row);
      if (!target) return;
      const field = editEl.dataset.field;
      startEdit(editEl, {
        value: target[field],
        numeric: field==='amount',
        onCommit: v => { target[field] = v; }
      });
      return;
    }

    const toggleTypeBtn = e.target.closest('[data-action="toggle-category-type"]');
    if (toggleTypeBtn){
      const cat = state.categories.find(c=>c.id===toggleTypeBtn.dataset.cat);
      if (cat){
        cat.type = cat.type==='liability' ? 'asset' : 'liability';
        render(); saveState();
      }
      return;
    }

    const toggleIncludedBtn = e.target.closest('[data-action="toggle-category-included"]');
    if (toggleIncludedBtn){
      const cat = state.categories.find(c=>c.id===toggleIncludedBtn.dataset.cat);
      if (cat){
        cat.included = !isCounted(cat);
        render(); saveState();
      }
      return;
    }

    const toggleEl = e.target.closest('[data-action="toggle-category"]');
    if (toggleEl){
      const cat = state.categories.find(c=>c.id===toggleEl.dataset.cat);
      if (cat){ cat.open = !cat.open; renderAccounts(); }
      return;
    }

    const toggleSplitBtn = e.target.closest('[data-action="toggle-split-panel"]');
    if (toggleSplitBtn){
      const row = toggleSplitBtn.closest('[data-acc]');
      const cat = state.categories.find(c=>c.id===row.dataset.cat);
      const acc = cat && cat.accounts.find(a=>a.id===row.dataset.acc);
      if (acc){ acc.splitOpen = !acc.splitOpen; renderAccounts(); }
      return;
    }

    const startSplitBtn = e.target.closest('[data-action="start-split"]');
    if (startSplitBtn){
      const row = startSplitBtn.closest('[data-acc]');
      const cat = state.categories.find(c=>c.id===row.dataset.cat);
      const acc = cat && cat.accounts.find(a=>a.id===row.dataset.acc);
      if (acc){
        acc.splits = [{ id: uid('sp'), name: acc.name, amount: acc.amount||0 }];
        acc.splitOpen = true;
        render(); saveState();
      }
      return;
    }

    const mergeBtn = e.target.closest('[data-action="merge-splits"]');
    if (mergeBtn){
      const row = mergeBtn.closest('[data-acc]');
      const cat = state.categories.find(c=>c.id===row.dataset.cat);
      const acc = cat && cat.accounts.find(a=>a.id===row.dataset.acc);
      if (acc){
        acc.amount = accountTotal(acc);
        acc.splits = [];
        acc.splitOpen = false;
        render(); saveState();
      }
      return;
    }

    const showAddSplitBtn = e.target.closest('[data-action="show-add-split"]');
    if (showAddSplitBtn){
      const wrap = showAddSplitBtn.closest('.add-split-row');
      showAddSplitBtn.hidden = true;
      const form = wrap.querySelector('.split-form');
      form.hidden = false;
      form.querySelector('[data-field="name"]').focus();
      return;
    }
    const cancelAddSplitBtn = e.target.closest('[data-action="cancel-add-split"]');
    if (cancelAddSplitBtn){
      const wrap = cancelAddSplitBtn.closest('.add-split-row');
      wrap.querySelector('.split-form').hidden = true;
      wrap.querySelector('[data-action="show-add-split"]').hidden = false;
      return;
    }

    const removeSplitBtn = e.target.closest('[data-action="remove-split"]');
    if (removeSplitBtn){
      const row = removeSplitBtn.closest('[data-split]');
      const cat = state.categories.find(c=>c.id===row.dataset.cat);
      const acc = cat && cat.accounts.find(a=>a.id===row.dataset.acc);
      const sp = acc && acc.splits.find(s=>s.id===row.dataset.split);
      if (acc && sp && confirm('Remove "'+sp.name+'"?')){
        acc.splits = acc.splits.filter(s=>s.id!==row.dataset.split);
        if (acc.splits.length===0) acc.amount = 0;
        render(); saveState();
      }
      return;
    }

    const removeAccBtn = e.target.closest('[data-action="remove-account"]');
    if (removeAccBtn){
      const row = removeAccBtn.closest('[data-acc]');
      const cat = state.categories.find(c=>c.id===row.dataset.cat);
      const acc = cat && cat.accounts.find(a=>a.id===row.dataset.acc);
      if (acc && confirm('Remove "'+acc.name+'"?')){
        cat.accounts = cat.accounts.filter(a=>a.id!==row.dataset.acc);
        render(); saveState();
      }
      return;
    }

    const showAddBtn = e.target.closest('[data-action="show-add-account"]');
    if (showAddBtn){
      const wrap = showAddBtn.closest('.add-account-row');
      showAddBtn.hidden = true;
      const form = wrap.querySelector('.inline-form');
      form.hidden = false;
      form.querySelector('[data-field="name"]').focus();
      return;
    }
    const cancelAddBtn = e.target.closest('[data-action="cancel-add-account"]');
    if (cancelAddBtn){
      const wrap = cancelAddBtn.closest('.add-account-row');
      wrap.querySelector('.inline-form').hidden = true;
      wrap.querySelector('[data-action="show-add-account"]').hidden = false;
      return;
    }

    const removeCatBtn = e.target.closest('[data-action="remove-category"]');
    if (removeCatBtn){
      const id = removeCatBtn.dataset.cat;
      const cat = state.categories.find(c=>c.id===id);
      if (cat && confirm('Remove "'+cat.name+'" and all its accounts?')){
        state.categories = state.categories.filter(c=>c.id!==id);
        render(); saveState();
      }
      return;
    }

    const plusBtn = e.target.closest('[data-action="adjust-plus"]');
    const minusBtn = e.target.closest('[data-action="adjust-minus"]');
    if (plusBtn || minusBtn){
      const sign = plusBtn ? 1 : -1;
      const row = (plusBtn||minusBtn).closest('[data-acc]');
      const target = resolveRowTarget(row);
      if (!target) return;
      const raw = prompt((sign>0 ? 'Add how much to ' : 'Subtract how much from ') + target.name + '?');
      if (raw===null) return;
      const delta = Number(raw);
      if (Number.isNaN(delta) || delta<=0) return;
      target.amount = Number(target.amount||0) + sign*delta;
      render(); saveState();
      return;
    }
  });

  document.addEventListener('submit', e=>{
    const accForm = e.target.closest('.inline-form');
    if (accForm){
      e.preventDefault();
      const name = accForm.querySelector('[data-field="name"]').value.trim();
      const amount = Number(accForm.querySelector('[data-field="amount"]').value);
      if (!name || Number.isNaN(amount)) return;
      const cat = state.categories.find(c=>c.id===accForm.dataset.cat);
      if (cat){ cat.accounts.push({id:uid('a'), name, amount, splits:[]}); render(); saveState(); }
      return;
    }
    const splitForm = e.target.closest('.split-form');
    if (splitForm){
      e.preventDefault();
      const name = splitForm.querySelector('[data-field="name"]').value.trim();
      const amount = Number(splitForm.querySelector('[data-field="amount"]').value);
      if (!name || Number.isNaN(amount)) return;
      const cat = state.categories.find(c=>c.id===splitForm.dataset.cat);
      const acc = cat && cat.accounts.find(a=>a.id===splitForm.dataset.acc);
      if (acc){
        if (!acc.splits) acc.splits = [];
        acc.splits.push({ id: uid('sp'), name, amount });
        render(); saveState();
      }
    }
  });

  document.addEventListener('keydown', e=>{
    if (e.key==='Escape' && !modalBackdrop.hidden){ closeModal(); return; }
    if (e.key==='Enter' || e.key===' '){
      const head = e.target.closest('[data-action="toggle-category"]');
      if (head){ e.preventDefault(); head.click(); }
    }
  });

  function todayLabel(){
    return new Date().toLocaleDateString('en-IN',{day:'numeric', month:'short'});
  }

  // Called on every render. While the date matches today's label, this keeps
  // overwriting the last history entry with the live total — so "today" moves
  // as you edit. The moment the date changes, the label no longer matches, so
  // a fresh entry is pushed instead and everything before it is left untouched
  // (effectively "locking in" what today's value was, right at the date change).
  function syncTodayHistory(){
    const label = todayLabel();
    const total = grandTotal();
    const last = state.history[state.history.length-1];
    if (last && last.label === label){ last.total = total; }
    else { state.history.push({label, total}); }
  }

  function clearHistory(){
    if (!confirm('Clear all recorded growth history? This can\'t be undone.')) return;
    state.history = [];
    render();
    saveState();
  }
  $('#clearHistoryBtn').addEventListener('click', clearHistory);
  $('#backupBtn').addEventListener('click', downloadBackup);

  $('#changeMpinBtn').addEventListener('click', ()=>{
    openModal('Change MPIN',
      '<label>Current MPIN<input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" name="currentMpin" required></label>'
      + '<label>New MPIN (4 digits)<input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" name="newMpin" required></label>'
      + '<label>Confirm new MPIN<input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" name="confirmMpin" required></label>',
      form=>{
        const current = form.currentMpin.value;
        const next = form.newMpin.value;
        const confirmVal = form.confirmMpin.value;
        const correctMpin = state.mpin || APP_MPIN_DEFAULT;
        if (current !== correctMpin){ alert('Current MPIN is incorrect.'); return; }
        if (!/^\d{4}$/.test(next)){ alert('New MPIN must be exactly 4 digits.'); return; }
        if (next !== confirmVal){ alert('New MPIN and confirmation don\'t match.'); return; }
        state.mpin = next;
        saveState();
        alert('MPIN updated. Use it next time you unlock.');
      }
    );
  });

  $('#editCapitalBtn').addEventListener('click', ()=>{
    openModal('Edit starting capital',
      '<label>Starting capital<input type="number" name="capital" value="'+state.initialCapital+'" required step="1"></label>',
      form=>{ const v = Number(form.capital.value); if (!Number.isNaN(v)) state.initialCapital = v; render(); saveState(); }
    );
  });

  $('#addCategoryBtn').addEventListener('click', ()=>{
    openModal('Add category',
      '<label>Category name<input type="text" name="catname" required maxlength="30"></label>'
      + '<div class="modal-type-row">'
      + '<span class="modal-type-label">Type</span>'
      + '<button type="button" class="cat-type-badge" data-role="type-toggle" data-type="asset">Asset</button>'
      + '</div>'
      + '<div class="modal-type-row">'
      + '<span class="modal-type-label">Count toward net worth</span>'
      + '<button type="button" class="cat-type-badge" data-role="included-toggle" data-included="1">Counted</button>'
      + '</div>',
      form=>{
        const name = form.catname.value.trim();
        if (!name) return;
        const typeBtn = form.querySelector('[data-role="type-toggle"]');
        const includedBtn = form.querySelector('[data-role="included-toggle"]');
        const type = typeBtn ? typeBtn.dataset.type : 'asset';
        const included = includedBtn ? includedBtn.dataset.included === '1' : true;
        state.categories.push({ id: uid('c'), name, type, included, color: nextColor(), open:true, accounts:[] });
        render(); saveState();
      }
    );
    const typeBtn = modalEl.querySelector('[data-role="type-toggle"]');
    if (typeBtn){
      typeBtn.addEventListener('click', ()=>{
        const next = typeBtn.dataset.type === 'asset' ? 'liability' : 'asset';
        typeBtn.dataset.type = next;
        typeBtn.textContent = next === 'liability' ? 'Liability' : 'Asset';
        typeBtn.classList.toggle('liability', next === 'liability');
      });
    }
    const includedBtn = modalEl.querySelector('[data-role="included-toggle"]');
    if (includedBtn){
      includedBtn.addEventListener('click', ()=>{
        const next = includedBtn.dataset.included === '1' ? '0' : '1';
        includedBtn.dataset.included = next;
        includedBtn.textContent = next === '1' ? 'Counted' : 'Not counted';
        includedBtn.classList.toggle('excluded', next === '0');
      });
    }
  });

  /* ---------- PIN lock (MPIN) ---------- */

  function initLock(){
    const lockScreen = document.getElementById('lockScreen');
    const appRoot = document.getElementById('appRoot');
    const dotsWrap = document.getElementById('pinDots');
    const dots = dotsWrap.querySelectorAll('.pin-dot');
    const pinError = document.getElementById('pinError');
    const keypad = document.getElementById('keypad');
    let buffer = '';

    function unlockApp(){
      lockScreen.hidden = true;
      appRoot.hidden = false;
      boot();
    }

    function lockApp(){
      appRoot.hidden = true;
      lockScreen.hidden = false;
      pinError.hidden = true;
      reset();
    }

    function showError(msg){
      pinError.textContent = msg;
      pinError.hidden = false;
    }

    function renderDots(){
      dots.forEach((d,i)=> d.classList.toggle('filled', i < buffer.length));
    }

    function reset(){
      buffer = '';
      renderDots();
    }

    async function submitIfReady(){
      if (buffer.length !== 4) return;
      const entered = buffer;
      await ensureStateLoaded();
      const correctMpin = state.mpin || APP_MPIN_DEFAULT;
      if (entered === correctMpin){
        unlockApp();
      } else {
        dotsWrap.classList.add('error');
        showError('Incorrect MPIN');
        setTimeout(()=>{
          dotsWrap.classList.remove('error');
          reset();
        }, 500);
      }
    }

    function pressKey(key){
      if (key === 'back'){
        buffer = buffer.slice(0, -1);
        pinError.hidden = true;
        renderDots();
        return;
      }
      if (buffer.length >= 4) return;
      buffer += key;
      pinError.hidden = true;
      renderDots();
      if (buffer.length === 4) submitIfReady();
    }

    keypad.addEventListener('click', e=>{
      const btn = e.target.closest('.key[data-key]');
      if (btn) pressKey(btn.dataset.key);
    });

    // Press-and-hold visual feedback: the ring should only show while the
    // finger/pointer is actually down on a key, not linger after release
    // (which is what CSS :hover does on touchscreens).
    keypad.querySelectorAll('.key[data-key]').forEach(btn=>{
      const press = ()=> btn.classList.add('pressed');
      const release = ()=> btn.classList.remove('pressed');
      btn.addEventListener('touchstart', press, {passive:true});
      btn.addEventListener('touchend', release);
      btn.addEventListener('touchcancel', release);
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
    });

    document.addEventListener('keydown', e=>{
      if (lockScreen.hidden) return;
      if (e.key >= '0' && e.key <= '9') pressKey(e.key);
      else if (e.key === 'Backspace') pressKey('back');
    });

    const lockBtn = document.getElementById('lockBtn');
    if (lockBtn) lockBtn.addEventListener('click', lockApp);
  }

  /* ---------- init ---------- */

  async function boot(){
    todayDateEl.textContent = new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
    initCharts();
    await ensureStateLoaded();
    render();
    saveState();
  }
  initLock();

})();
</script>
